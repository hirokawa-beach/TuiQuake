name: Release binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            source: target/release/tuiquake.exe
            asset: tuiquake-windows-x86_64.exe
          - runner: ubuntu-22.04
            source: target/release/tuiquake
            asset: tuiquake-linux-x86_64
          - runner: ubuntu-22.04-arm
            source: target/release/tuiquake
            asset: tuiquake-linux-aarch64
          - runner: macos-15-intel
            source: target/release/tuiquake
            asset: tuiquake-macos-x86_64
          - runner: macos-15
            source: target/release/tuiquake
            asset: tuiquake-macos-aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test and build
        id: build
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo +stable test --locked
          cargo +stable build --release --locked
          "./$SOURCE" --help
          version_output=$("./$SOURCE" --version)
          if [[ ! $version_output =~ ^TuiQuake\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'Could not determine the release version from %s\n' "$version_output" >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s does not match TuiQuake %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

          asset="tuiquake-$version-${ASSET#tuiquake-}"
          mkdir -p release-assets
          cp "$SOURCE" "release-assets/$asset"
          printf 'version=%s\nasset=%s\n' "$version" "$asset" >> "$GITHUB_OUTPUT"
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
          VERSION: ${{ steps.build.outputs.version }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          $wixTools = Join-Path $env:RUNNER_TEMP 'tuiquake-wix'
          dotnet tool install wix --version 6.0.2 --tool-path $wixTools
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }

          $exe = (Resolve-Path 'target/release/tuiquake.exe').Path
          $version = $env:VERSION
          $versionOutput = "TuiQuake $version"
          $rustNotice = Join-Path (rustc +stable --print sysroot) 'share/doc/rust/COPYRIGHT-library.html'
          $msi = Join-Path (Resolve-Path 'release-assets').Path ([IO.Path]::ChangeExtension($env:ASSET, '.msi'))
          & (Join-Path $wixTools 'wix.exe') build -arch x64 -pdbtype none -d "Version=$version" -d "Executable=$exe" -d "RustNotice=$rustNotice" -o $msi installer/TuiQuake.wxs
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed.' }

          function Invoke-Msi([string] $mode) {
            $process = Start-Process msiexec.exe -ArgumentList "$mode `"$msi`" /qn /norestart" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Windows Installer $mode failed with code $($process.ExitCode)." }
          }

          Invoke-Msi '/i'
          try {
            $folder = (Get-ItemProperty 'HKCU:\Software\TuiQuake').InstallFolder.TrimEnd('\')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if (($userPath.Split(';').TrimEnd('\')) -notcontains $folder) {
              throw 'TuiQuake was not added to the user PATH.'
            }
            $env:Path = "$userPath;$env:Path"
            if ((Get-Command tuiquake.exe).Source -ne (Join-Path $folder 'tuiquake.exe')) {
              throw 'tuiquake.exe did not resolve to the installed executable.'
            }
            $installedVersion = tuiquake.exe --version
            if ($LASTEXITCODE -ne 0 -or $installedVersion -ne $versionOutput) {
              throw 'The installed executable did not report the expected version.'
            }
          } finally {
            Invoke-Msi '/x'
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';').TrimEnd('\') -contains $folder -or (Test-Path (Join-Path $folder 'tuiquake.exe'))) {
            throw 'The uninstall left the executable or its PATH entry in place.'
          }
      - name: Build and test Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          rustup component add rust-docs --toolchain stable
          rust_notice="$(rustc +stable --print sysroot)/share/doc/rust/COPYRIGHT-library.html"
          arch=$(dpkg --print-architecture)
          package="./release-assets/tuiquake_${VERSION}_${arch}.deb"
          bash installer/build-deb.sh target/release/tuiquake "$package" "$rust_notice"
          sudo apt-get install -y "$package"
          trap 'sudo apt-get remove -y tuiquake' EXIT
          test "$(command -v tuiquake)" = /usr/bin/tuiquake
          test "$(tuiquake --version)" = "$(target/release/tuiquake --version)"
      - name: Build and verify macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.build.outputs.version }}
          ASSET: ${{ steps.build.outputs.asset }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          rustup component add rust-docs --toolchain stable
          rust_notice="$(rustc +stable --print sysroot)/share/doc/rust/COPYRIGHT-library.html"

          work=$(mktemp -d "${RUNNER_TEMP}/tuiquake-pkg.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          payload="$work/root"
          docs=usr/local/share/doc/tuiquake
          mkdir -p "$payload/usr/local/bin" "$payload/$docs"
          install -m 755 "$SOURCE" "$payload/usr/local/bin/tuiquake"
          install -m 644 LICENSE "$payload/$docs/LICENSE.txt"
          install -m 644 THIRD_PARTY_NOTICES.txt "$payload/$docs/THIRD_PARTY_NOTICES.txt"
          install -m 644 "$rust_notice" "$payload/$docs/RUST-STDLIB-NOTICES.html"

          package="release-assets/$ASSET.pkg"
          pkgbuild --root "$payload" --install-location / --identifier io.github.hirokawabeach.tuiquake --version "$VERSION" "$package"
          pkgutil --expand-full "$package" "$work/expanded"
          diff -r "$payload" "$work/expanded/Payload"
          test "$("$work/expanded/Payload/usr/local/bin/tuiquake" --version)" = "TuiQuake $VERSION"
      - name: Test Homebrew installation
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew tap hirokawa-beach/tuiquake "$GITHUB_WORKSPACE"
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula hirokawa-beach/tuiquake/tuiquake
          fi
          brew install hirokawa-beach/tuiquake/tuiquake
          brew test hirokawa-beach/tuiquake/tuiquake
          test "$(tuiquake --version)" = "$(target/release/tuiquake --version)"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release-assets/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tuiquake-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rust-docs
          rust_docs="$(rustc +stable --print sysroot)/share/doc/rust"
          cp "$rust_docs/COPYRIGHT-library.html" release-assets/RUST-STDLIB-NOTICES.html
          cp LICENSE release-assets/LICENSE.txt
          cp THIRD_PARTY_NOTICES.txt release-assets/
          cd release-assets
          assets=(tuiquake[-_]*)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes \
            "${assets[@]}" SHA256SUMS.txt LICENSE.txt THIRD_PARTY_NOTICES.txt RUST-STDLIB-NOTICES.html
