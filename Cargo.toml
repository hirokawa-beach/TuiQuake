[package]
name = "tuiquake"
version = "0.1.11"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/hirokawa-beach/TuiQuake"
description = "Japanese earthquake information and EEW in the terminal"

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
crossterm = "0.29"
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
